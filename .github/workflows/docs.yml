name: Deploy Docs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      # PRs only check that the site builds. Deploying is left to pushes to main (i.e. after merge).
      - if: github.event_name == 'pull_request'
        run: mkdocs build
      - if: github.event_name == 'push'
        run: mkdocs gh-deploy --force
